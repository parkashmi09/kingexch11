<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Home banners are served from this CDN. Warming DNS+TLS here saves the
         handshake on mobile, where it costs several hundred ms before the first
         banner byte can even start. -->
    <link rel="preconnect" href="https://sitethemedata.com" crossorigin />
    <link rel="dns-prefetch" href="https://sitethemedata.com" />
    <!-- Use the splash-loader window to fetch the first home banner.
         This runs during HTML parse — roughly a second before the ~800KB JS
         bundle has even executed — so by the time the splash is ready to close
         the image is usually decoded already. The URL comes from the cache
         BannerCarousel writes ('ten:carousel'); main.jsx closes the splash on
         window.__bannerReady / the 'banner-ready' event. A first-ever visit has
         no cache, so the component fires the same event once its image lands. -->
    <script>
      window.__bannerReady = false;
      (function () {
        try {
          var list = JSON.parse(localStorage.getItem('ten:carousel'));
          var src = list && list[0] && list[0].img;
          if (!src) return;
          // Bytes already in localStorage from a previous visit: nothing to
          // fetch, the banner is ready before the splash has even painted.
          var kept = JSON.parse(localStorage.getItem('ten:banner0') || 'null');
          if (kept && kept.url === src && kept.data) {
            window.__bannerReady = true;
            return;
          }
          var img = new Image();
          img.decoding = 'async';
          img.fetchPriority = 'high';
          img.onload = img.onerror = function () {
            window.__bannerReady = true;
            window.dispatchEvent(new Event('banner-ready'));
          };
          img.src = src;
          window.__bannerImg = img; // keep it alive; the component reuses the cache entry
        } catch (e) { /* private mode / bad JSON — the component handles it */ }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // iOS Safari ignores user-scalable=no; pre-iOS-13 devices also ignore
      // touch-action, so block their legacy GestureEvent pinch-zoom directly.
      // Zoom acquired this way persists across refresh and makes the casino
      // stream look zoomed in.
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
    </script>
    <title>Clickbetexchenge - World Number 1 Exchange Platform</title>
    <!-- Critical CSS for the boot splash. The real stylesheet ships inside the
         JS bundle, which has not been parsed yet while the splash is the only
         thing on screen — so the handful of rules it needs are inlined, with
         literal fallbacks for the CSS vars. -->
    <style>
      body {
        margin: 0;
        background-color: var(--bodybg, #F8F7FA);
      }
      /* Full-screen splash held until the first banner has painted (main.jsx),
         then faded out. */
      .app-splash {
        position: fixed;
        inset: 0;
        height: 100vh;
        width: 100%;
        background-color: var(--bodybg, #F8F7FA);
        z-index: 1040;
      }
      .app-splash.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
    </style>
  </head>
  <body class="app-loading dark-theme">
    <div class="app-splash" id="app-splash"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
