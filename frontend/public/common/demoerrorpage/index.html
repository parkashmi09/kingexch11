<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0,  shrink-to-fit=no, viewport-fit=cover" />
    <title>Cricadda</title>

    <!--
      Local copy of the reference's /common/demoerrorpage/index.html — the page
      the Lottery tile frames. The CSS and the body below are the original,
      unchanged; only the five CDN references were swapped for local files:

        bootstrap.min.css   -> bootstrap.min.css   (same 4.4.1 build, kept in full:
                               Reboot sets the h2/h4 size, weight and margins here)
        Google Fonts        -> notosans.css        (Noto Sans, latin subset)
        Font Awesome        -> dropped, its only rule targets .print-page a i,
                               which this page does not render
        jQuery / Popper /
        bootstrap.min.js    -> dropped, the page is static and calls none of them

      Nothing here reaches a third-party host.
    -->
    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="stylesheet" href="notosans.css" />

    <style>
         :root {
            --bg-body: #1B181F;
            --text-body: #aaafb5;
            --text-highlight: #fff;
        }

        body {
            font-family: "Noto Sans";
            background-color: var(--bg-body);
            font-size: 16px;
            line-height: 22px;
            letter-spacing: 0;
            color: var(--text-body);
            scrollbar-width: thin;
        }

        .about-us-container {
            background-color: var(--bg-body);
            color: var(--text-body);
            padding: 20px;
            padding-bottom: 20px;
            width: 100%;
            padding-bottom: 0;
        }

        .logo {
            padding: 10px;
        }

        .logo img {
            max-height: 105px;
            max-width: 100%;
        }

        .about-us-container .page-title {
            text-transform: uppercase;
            text-align: center;
            margin-top: 20px;
            color: var(--text-highlight);
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .about-us-container h4 {
            font-size: 24px;
        }

        .about-us-container h5,
        .about-us-container p {
            font-size: var(--font-body);
            margin-bottom: 20px;
        }

        .about-us-container ul>li {
            list-style: disc;
            padding: 5px 10px;
            margin: 0 10px;
        }

        .lighttheme .about-us-container {
            background-color: #ffffff;
            color: #3c444b;
        }

        .lighttheme .about-us-container .page-title {
            color: #000;
        }

        .print-page {
            text-align: right;
            width: 100%;
            margin-top: 20px;
            padding-right: 20px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .print-page a i {
            color: #ffffff;
            font-size: 24px;
        }

        .coming-soon {
            text-align: center;
        }

        .coming-soon img {
            max-height: 300px;
            margin-top: 50px;
            max-width: 90%;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="about-us-container">
            <div class="container">
                <div class="coming-soon">
                    <img src="login.png" alt="Coming Soon">
                </div>
                <h2 class="text-center mt-5">Sorry For Inconvenience!</h2>
                <h4 class="text-center">Login with Real USER to play all these games.</h4>
            </div>
        </div>
    </div>
</body>

</html>
