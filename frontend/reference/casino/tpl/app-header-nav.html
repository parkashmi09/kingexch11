<div class="menu-wrap">

    <ul class="tab-menu pull-left">
      <li class="ver-menu">
        <a class="navbar-item" routerLinkActive="active" [ngClass] [click] (click)>
          Home
        </a>
      </li>
      <li class="ver-menu">
        <a class="navbar-item" [ngClass] [click] (click)>
          In-Play
        </a>
      </li>
      <li class="ver-menu">
        <a class="navbar-item" [ngClass] [click] (click) (click)>

        </a>
      </li>
      <ng-for fn="nme">

          <a class="Virtual navbar-item" [ngClass] [click] (click)>

      <a routerLink="settings" [click] (click) (click)>
