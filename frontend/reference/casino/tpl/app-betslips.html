<ng-if fn="Qre">
  <div class="fancy-quick-tr placebet">
    <div class="pb-1 place-bet paddtp" [ngClass]>
      <div class="container">
        <div class="row pb-0 pt-0">
          <div class="col-6 text-bold inputset padd-0">
            <div class="priceClass">
              <button class="stakeactionminus1 btn betButtonMinus" disabled style="position: absolute; left: 0" [click] (click)>
                <span class="betButtonMinus">
                  <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="19px" height="19px" viewBox="0 0 19 19" enable-background="new 0 0 19 19" xml:space="preserve">
                    <g>
                      <path fill="currentColor" d="M8.056,10.838H0.409V8.091h7.647 M2,8.091h16.591v2.747H8" />
                    </g>
                  </svg>
                </span>
                <span class="betButtonMinus"></span>
              </button>
              <input class="stakeinput quick-bet-confirm text-center" disabled type="text" [value] />
              <button class="stakeactionplus1 btn betButtonPlus" disabled style="position: absolute; right: 0" [click] (click)>
                <span class="betButtonPlus">
                  <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="19px" height="19px" viewBox="0 0 19 19" enable-background="new 0 0 19 19" xml:space="preserve">
                    <g>
                      <path fill="currentColor" d="M10.946,0.127v7.964h7.646v2.747h-7.646v8.035h-2.89v-8.035H0.409V8.091h7.647V0.127H10.946z" />
                    </g>
                  </svg>
                </span>
              </button>
            </div>
          </div>
          <div class="col-6 text-bold inputset padd-0">
            <div class="priceClass">
              <button class="stakeactionminus btn betButtonMinus" style="position: absolute; left: 0" [click] (click)>
                <span class="betButtonMinus">
                  <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="19px" height="19px" viewBox="0 0 19 19" enable-background="new 0 0 19 19" xml:space="preserve">
                    <g>
                      <path fill="currentColor" d="M8.056,10.838H0.409V8.091h7.647 M2,8.091h16.591v2.747H8" />
                    </g>
                  </svg>
                </span>
                <span class="betButtonMinus"></span>
              </button>
              <input class="stakeinput input-Betslip text-center" id="betAmount" type="number" placeholder="01" [ngModel] [ngModelChange] [keyup] (ngModelChange) (keyup)>
              </input>
              <button class="stakeactionplus btn betButtonPlus" style="position: absolute; right: 0" [click] (click)>
                <span class="betButtonPlus">
                  <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="19px" height="19px" viewBox="0 0 19 19" enable-background="new 0 0 19 19" xml:space="preserve">
                    <g>
                      <path fill="currentColor" d="M10.946,0.127v7.964h7.646v2.747h-7.646v8.035h-2.89v-8.035H0.409V8.091h7.647V0.127H10.946z" />
                    </g>
                  </svg>
                </span>
              </button>
            </div>
          </div>
        </div>
        <div class="row stackbutton" [ngClass]>
          <ng-if fn="Xre">
            <ng-container>
              <ng-for fn="Yre">
                <div class="col-3 p-1 stack-inputs" [click] (click)>
                  <a class="btn btn-block kbc-tab">
                    {{ }}
                  </a>
                </div>
              </ng-for>
            </ng-container>
          </ng-if>
          <ng-if fn="qre">
            <ng-container>
              <ng-for fn="Kre">
                <div class="col-3 p-1 stack-inputs" [click] (click)>
                  <a class="btn btn-block fancy-quick-btn">
                    {{ }}
                  </a>
                </div>
              </ng-for>
            </ng-container>
          </ng-if>
        </div>
        <div class="row mt-0 pb-0 pt-0 stackbutton" [ngClass]>
          <div class="col-6 p-1 pb-0" [click] (click)>
            <a class="btn btn-secondary btn-block btn-cancel">
               Cancel 
            </a>
          </div>
          <div class="col-6 p-1 pb-0">
            <button class="btn btn-send" [ngClass] [disabled] [click] (click)>
               Place Bet 
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-if>
<ng-if fn="tie">
  <div class="fancy-quick-tr placebet">
    <div class="place-bet" [ngClass]>
      <div class="container">
        <div class="row pb-0 pt-0" [ngClass]>
          <div class="col p-1 pb-0 hideMobile" [click] (click)>
            <a class="btn btn-secondary btn-block btn-cancel">
               Cancel 
            </a>
          </div>
          <div class="col text-right ipadPro p-1">
            <button class="stakeactionminus btn betButtonMinus" disabled [click] (click)>
              <span class="betButtonMinus">
                <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="19px" height="19px" viewBox="0 0 19 19" enable-background="new 0 0 19 19" xml:space="preserve">
                  <g>
                    <path fill="currentColor" d="M8.056,10.838H0.409V8.091h7.647 M2,8.091h16.591v2.747H8" />
                  </g>
                </svg>
              </span>
            </button>
            <ng-if fn="Zre">
              <input class="stakeinput input-Betslip text-center" id="betstack" type="text" readonly="readonly" placeholder="0" disabled [value] />
            </ng-if>
            <ng-if fn="Jre">
              <input class="stakeinput input-Betslip text-center" id="betstack" type="text" readonly="readonly" placeholder="0" [value] [disabled] />
            </ng-if>
            <button class="stakeactionplus btn betButtonPlus float-end" disabled [click] (click)>
              <span class="betButtonPlus">
                <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="19px" height="19px" viewBox="0 0 19 19" enable-background="new 0 0 19 19" xml:space="preserve">
                  <g>
                    <path fill="currentColor" d="M10.946,0.127v7.964h7.646v2.747h-7.646v8.035h-2.89v-8.035H0.409V8.091h7.647V0.127H10.946z" />
                  </g>
                </svg>
              </span>
            </button>
          </div>
          <div class="col text-right ipadPro p-1">
            <button class="stakeactionminus btn betButtonMinus" [click] (click)>
              <span class="betButtonMinus">
                <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="19px" height="19px" viewBox="0 0 19 19" enable-background="new 0 0 19 19" xml:space="preserve">
                  <g>
                    <path fill="currentColor" d="M8.056,10.838H0.409V8.091h7.647 M2,8.091h16.591v2.747H8" />
                  </g>
                </svg>
              </span>
            </button>
            <input class="stakeinput input-Betslip text-center" id="betAmount" type="number" placeholder="0" [ngModel] [ngModelChange] [keyup] (ngModelChange) (keyup)>
            </input>
            <button class="stakeactionplus1 btn betButtonPlus float-end" [click] (click)>
              <span class="betButtonPlus">
                <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="19px" height="19px" viewBox="0 0 19 19" enable-background="new 0 0 19 19" xml:space="preserve">
                  <g>
                    <path fill="currentColor" d="M10.946,0.127v7.964h7.646v2.747h-7.646v8.035h-2.89v-8.035H0.409V8.091h7.647V0.127H10.946z" />
                  </g>
                </svg>
              </span>
            </button>
          </div>
          <div class="col p-1 pb-0 hideMobile">
            <button class="btn btn-send" [ngClass] [disabled] [click] (click)>
               Place Bet 
            </button>
          </div>
        </div>
        <div class="row stackbutton p-2 pt-0 pb-0" [ngClass]>
          <ng-for fn="eie">
            <div class="col-3 col-xs-3 col-sm-3 col-md-3 desktopwd p-1">
              <a class="btn btn-block fancy-quick-btn" [click] (click)>
                {{ }}
              </a>
            </div>
          </ng-for>
        </div>
      </div>
    </div>
  </div>
</ng-if>
